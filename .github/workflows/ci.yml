name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: azure/setup-helm@v4
      - name: helm lint + render + schema check (kind, AKS, GKE values)
        run: |
          CHART=infra/helm/doppelganger
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for target in kind aks gke; do
            args="-f $CHART/values-$target.yaml --set backend.apiKey=ci --set ingress.host=example.com --set index.azureBlob.account=ci --set index.gcs.bucket=ci"
            helm lint "$CHART" $args
            helm template ci "$CHART" $args > rendered-$target.yaml
            # ServiceMonitor / BackendConfig / ManagedCertificate are CRDs without public schemas
            ./kubeconform -summary -ignore-missing-schemas rendered-$target.yaml
          done
