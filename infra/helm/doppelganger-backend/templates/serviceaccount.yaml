apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    # Workload Identity: this KSA acts as the GCP service account that can read the index bucket
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount }}
