image:
  repository: europe-west1-docker.pkg.dev/PROJECT_ID/doppelganger/backend  # terraform output image_repository
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# Index artifacts (embeddings, manifest, thumbnails) live in a private GCS bucket and are
# copied into an emptyDir by an init container at pod start - they're never baked into the image.
index:
  bucket: PROJECT_ID-doppelganger-index  # terraform output index_bucket
  prefix: index
  sizeLimit: 2Gi

serviceAccount:
  name: doppelganger-backend
  gcpServiceAccount: doppelganger-backend@PROJECT_ID.iam.gserviceaccount.com  # terraform output backend_gcp_service_account

# shared secret the Next.js proxy sends as X-API-Key; set with --set apiKey=... (stored as a Secret)
apiKey: ""

resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    memory: 2560Mi

service:
  port: 80
  targetPort: 8787

ingress:
  enabled: true
  staticIpName: doppelganger-ingress  # terraform output ingress_ip_name
  # set a domain you control to get a Google-managed HTTPS certificate; empty = HTTP on the static IP
  host: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
