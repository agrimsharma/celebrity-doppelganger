# AKS: images from ACR, index from Blob storage via workload identity, ingress-nginx + Let's Encrypt.
# up.sh fills in the image repositories, storage account, client id and host from terraform output.
index:
  source: azureBlob
serviceAccount:
  azureWorkloadIdentity: true
ingress:
  className: nginx
  tls: {enabled: true, clusterIssuer: letsencrypt}
backend:
  image: {pullPolicy: Always}
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetCPUUtilizationPercentage: 60}
frontend:
  image: {pullPolicy: Always}
monitoring:
  serviceMonitor: true
