# GKE: images from Artifact Registry, index from GCS via workload identity, ingress-nginx + Let's Encrypt.
# infra/session/up-gcp.sh fills in the repositories, bucket, service account and host.
index:
  source: gcs
ingress:
  className: nginx
  tls: {enabled: true, clusterIssuer: letsencrypt}
backend:
  image: {pullPolicy: Always}
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetCPUUtilizationPercentage: 60}
frontend:
  image: {pullPolicy: Always}
monitoring:
  serviceMonitor: true
