# local rehearsal: images loaded with `kind load`, index from a host folder, ingress-nginx on :8080
index:
  source: hostPath
  hostPath: /mnt/dopp-index
ingress:
  className: nginx
  host: doppelganger.localtest.me
backend:
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetCPUUtilizationPercentage: 60}
monitoring:
  serviceMonitor: true
